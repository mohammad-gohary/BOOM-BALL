let boss=null,bossDone=false,bossClock=0,shopFilter='all';let profile=loadProfile(),stage=1,stageTime=0,stageKills=0,runBanked=false,roll=0,rollCD=0,lastTap=-1000,shopMode='space';let readyHeld=new Map(),countStep=-1,countTime=0;let elapsed=0,fireCD=0,laser=0,bomb=0,helpers=0,beamTick=0,invuln=0,wave=-1,aim={x:180,y:400},exits=[];let state='menu',mode='',score=0,lives=3,coins=0,gems=0,best=profile.best||0,objs=[],shots=[],enemyShots=[],enemies=[],drops=[],parts=[],stars=[],held=new Set(),pointer=false,targetX=W/2,shipX=W/2,t0=0,last=0,spawn=0,enemySpawn=0,freeze=0,magnet=0,shield=0,rapid=0,spread=0,pulse=0,shake=0,soundOn=true,audio;
for(let i=0;i<100;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random(),s:Math.random()*2+.3});


const chapters=[
{title:'آخرین چراغ',place:'بندر خاموش',color:'#305c78',accent:'#a2dcf1',text:'پس از قطع شبکه، تنها چراغ بندر هنوز روشن است. یک پیام ناقص از آن سوی حلقه می‌رسد؛ کسی آنجا منتظر مانده.',boss:'نگهبان بندر'},
{title:'ردی در غبار',place:'کمربند مس',color:'#774d37',accent:'#ffc89d',text:'رد سیگنال به معدن‌های متروک می‌رسد. ماشین‌ها هنوز کار می‌کنند، اما هیچ انسانی پاسخ نمی‌دهد.',boss:'حفار آهنین'},
{title:'شهر زیر یخ',place:'ایستگاه سپید',color:'#326878',accent:'#b6f2ef',text:'در دل یخ، خاطرات شهر دست‌نخورده مانده‌اند. برای بازیابی مختصات باید سامانهٔ دفاعی را بیدار کنی.',boss:'دیده‌بان یخ'},
{title:'باغ شیشه‌ای',place:'گنبد زیستی',color:'#38634f',accent:'#bbdfaa',text:'گیاهان دیوارها را شکافته‌اند. شبکه از اینجا تغذیه می‌شود؛ نجات گنبد یعنی بازگرداندن نفس شهر.',boss:'ریشهٔ فولاد'},
{title:'صدای گمشده',place:'آرشیو بنفش',color:'#5b477c',accent:'#d1bbfa',text:'صدای پیام آشناست. آرشیو نشان می‌دهد خاموشی تصادفی نبوده؛ کسی عمداً مسیر خانه را بسته است.',boss:'حافظ آرشیو'},
{title:'عبور از آتش',place:'کورهٔ مداری',color:'#803b34',accent:'#ffae91',text:'برای عبور از مدار بسته، انرژی کوره لازم است. هر ثانیهٔ بیشتر، خطر بیدارشدن ناو محافظ را بالا می‌برد.',boss:'قلب کوره'},
{title:'آن سوی سکوت',place:'دریای سیاه',color:'#284355',accent:'#91bace',text:'بیرون از شبکه هیچ نقشه‌ای وجود ندارد. پالس‌های دوردست تنها راهنمای تو هستند؛ مسیر را با احتیاط باز کن.',boss:'شکارچی خاموش'},
{title:'دو سوی آینه',place:'حلقهٔ نقره',color:'#536277',accent:'#e1eaf6',text:'سامانه نسخه‌ای از مسیر تو ساخته است. برای عبور باید نظم تکرارشوندهٔ حلقه را بشکنی.',boss:'آینه‌بان'},
{title:'بازگشت سیگنال',place:'برج سپیده',color:'#6c5a32',accent:'#f2db9d',text:'برج دوباره نفس می‌کشد. اکنون صدای بازمانده‌ها شنیده می‌شود، اما هسته هنوز فرمان خاموشی می‌دهد.',boss:'فرماندهٔ برج'},
{title:'خانه روشن می‌شود',place:'هستهٔ نخستین',color:'#315f6b',accent:'#b3f7ee',text:'تمام مسیرها به این نقطه رسیده‌اند. آخرین محافظ میان تو و بازگشت روشنایی ایستاده است.',boss:'هستهٔ خاموشی'}];
function chapter(m=mode,n=stage){return chapters[Math.min(9,Math.floor((n-1)/(m==='space'?15:20)))]}
function setTheme(){let c=chapter();document.documentElement.style.setProperty('--accent',c.accent);document.documentElement.style.setProperty('--chapter',c.color)}
function story(m,n,next){let c=chapter(m,n),span=m==='space'?15:20,part=(n-1)%span,beats=['رد سیگنال را پیدا کن.','مسیر ارتباط را باز نگه دار.','داده‌های پراکنده را جمع کن.','از خط دفاع عبور کن.','محافظ این بخش نزدیک است.'];state='story';$('classicControls').classList.add('hidden');$('readyNote').classList.add('hidden');$('countBig').classList.add('hidden');$('overlay').classList.remove('hidden');$('panel').className='panel storyPanel';document.documentElement.style.setProperty('--chapter',c.color);$('panel').innerHTML='<div class="storyArt"></div><div class="eyebrow">ECHOES / CHAPTER '+(Math.floor((n-1)/span)+1)+'</div><h2>'+c.title+'</h2><p>'+((part===0)?c.text:c.place+' — '+beats[part%5])+'</p><div class="storyObjective">'+(m==='space'?'مسیر سفینه':'مسیر پژواک')+' · مرحله '+n+'<br>'+(n%5===0?'مأموریت ویژه: شکست '+c.boss:'مأموریت: پاک‌سازی مسیر و تکمیل نوار پیشرفت')+'</div><button class="again" id="storyContinue">'+(n%5===0?'رویارویی با محافظ':'ادامهٔ مسیر')+'</button>';$('storyContinue').onclick=()=>{$('overlay').classList.add('hidden');$('panel').className='panel';next()}}
function start(m,n=profile.levels[m]){selectedStage=n;story(m,n,()=>{prepareRun(m);setTheme()})}
function iconSVG(kind,color='#9fd8e8',variant=1){let content='';if(kind==='repair')kind='life';if(kind==='nova')kind='bomb';if(kind==='skin'){let v=variant%4;content=v===0?'<path d="M50 12L78 78 50 65 22 78Z"/><path d="M50 25V60M35 59H65"/>':v===1?'<path d="M50 9L63 42 85 69 60 62 50 84 40 62 15 69 37 42Z"/><path d="M50 28L58 51 50 58 42 51Z"/>':v===2?'<path d="M50 12L70 34 79 78 50 62 21 78 30 34Z"/><path d="M50 30V59M32 51L22 72M68 51L78 72"/>':'<path d="M50 12L61 47 86 57 76 78 50 66 24 78 14 57 39 47Z"/><path d="M50 32V60"/>'}else if(kind==='ball'){content='<circle cx="50" cy="50" r="29"/><ellipse cx="50" cy="50" rx="'+(12+variant%4*4)+'" ry="29"/><path d="M22 42H78M24 61H76"/>'}else if(kind==='coin')content='<circle cx="50" cy="50" r="29"/><circle cx="50" cy="50" r="22"/><path d="M56 32H44V49H56V67H43M50 26V73"/>';else if(kind==='gem')content='<path d="M20 39L34 22H66L80 39 50 80Z"/><path d="M20 39H80M34 22L40 39 50 80 60 39 66 22M40 39L50 22 60 39"/>';else if(kind==='chest')content='<path d="M20 37L29 24H71L80 37V75H20Z"/><path d="M20 44H80M38 25V74M62 25V74"/><rect x="43" y="43" width="14" height="17"/>';else if(kind==='life'||kind==='heart')content='<path d="M32 20H68V36H84V64H68V80H32V64H16V36H32Z"/>';else if(kind==='shield')content='<path d="M50 15L79 28V49Q76 71 50 85Q24 71 21 49V28Z"/><path d="M35 49L46 60 66 38"/>';else if(kind==='freeze'||kind==='slow')content='<path d="M50 15V85M20 32L80 68M20 68L80 32M40 21L50 31 60 21M40 79L50 69 60 79"/>';else if(kind==='magnet')content='<path d="M23 25V57A27 27 0 0 0 77 57V25H59V57A9 9 0 0 1 41 57V25Z"/><path d="M23 40H41M59 40H77"/>';else if(kind==='helpers')content='<path d="M28 25L43 65 28 57 13 65ZM72 25L87 65 72 57 57 65Z"/><path d="M28 70V82M72 70V82"/>';else if(kind==='bomb')content='<circle cx="49" cy="58" r="24"/><path d="M49 34V24H65L74 15M69 12L80 23M34 56L43 47"/>';else if(kind==='spread')content='<path d="M50 85V15M50 85L22 25M50 85L78 25M15 31L22 25 31 27M69 27L78 25 85 31M43 23L50 15 57 23"/>';else content='<path d="M50 87V16M39 32L50 16 61 32M34 55V34M66 55V34M25 75H75"/>';return '<svg viewBox="0 0 100 100" fill="'+color+'18" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+content+'</svg>'}
function walletHTML(){return iconSVG('coin','#e0bd7b')+profile.coins+' '+iconSVG('gem','#bca7df')+profile.gems}
function loadProfile(){let base={upgrades:{},version:1,coins:0,gems:0,best:0,levels:{space:1,classic:1},owned:[],equipped:{space:0,classic:0},stock:{space:{},classic:{}},cleared:{space:0,classic:0}};try{let p=JSON.parse(localStorage.getItem('rageCampaignV1'));if(p&&p.version===1){for(let k of ['coins','gems','best'])if(Number.isFinite(p[k])&&p[k]>=0)base[k]=p[k];for(let m of ['space','classic']){base.levels[m]=Math.max(1,Math.min(m==='space'?150:200,Math.floor(p.levels?.[m]||1)));base.equipped[m]=p.equipped?.[m]||0;base.stock[m]=p.stock?.[m]||{};base.cleared[m]=p.cleared?.[m]||0}base.upgrades=p.upgrades||{};base.owned=Array.isArray(p.owned)?p.owned:[]}}catch(e){}return base}
function saveProfile(){try{localStorage.setItem('rageCampaignV1',JSON.stringify(profile))}catch(e){toast('ذخیره در مرورگر در دسترس نیست')}}
function skinColor(m){let n=profile.equipped[m];return n?'hsl('+((n*37+(m==='space'?90:170))%360)+' 90% 75%)':m==='space'?'#d8fff0':'#ffffff'}
function catalogue(m){let a=[];for(let i=1;i<=24;i++)a.push({id:m+'-skin-'+i,kind:'skin',n:i,label:(m==='space'?'سفینه':'توپ')+' نئون '+i,icon:m==='space'?'▲':'●',coins:120+i*65,gems:3+Math.floor(i/3)});let powers=m==='space'?['shield','rapid','spread','laser','bomb','helpers','freeze','magnet','repair','nova']:['shield','freeze','magnet','heart','coinBoost','gemBoost','slow','powder'];let labels={shield:'سپر',rapid:'شلیک سریع',spread:'شاتگان',laser:'لیزر',bomb:'بمب',helpers:'یار کمکی',freeze:'فریز',magnet:'آهنربا',heart:'جان اضافه',repair:'ترمیم',nova:'موج پاک‌سازی',coinBoost:'پاداش سکه',gemBoost:'پاداش الماس',slow:'شروع آهسته',powder:'پودرکن خودکار'};powers.forEach((key,i)=>a.push({id:m+'-'+key,kind:'power',key,label:labels[key],icon:'',coins:110+i*25,gems:3+i%3}));for(let i=1;i<=4;i++)a.push({id:m+'-life-'+i,kind:'life',n:i,label:i+' جان ذخیره',icon:'',coins:90*i,gems:3*i});for(let i=1;i<=4;i++)a.push({id:m+'-chest-'+i,kind:'chest',n:i,label:'صندوق '+i+' آیتم',icon:'',coins:160*i,gems:5*i});return a}
function shop(m){shopMode=m;state='shop';$('overlay').classList.remove('hidden');$('panel').className='panel shopPanel';$('panel').innerHTML='<div class="shopHead"><div><div class="eyebrow">THE OUTPOST / EQUIPMENT</div><h2>تجهیزگاه مسافر</h2></div><button class="back" id="shopBack">بازگشت</button></div><div class="wallet">'+walletHTML()+'</div><div class="shopTabs"><button id="tabSpace" class="'+(m==='space'?'selected':'')+'">سفینه</button><button id="tabClassic" class="'+(m==='classic'?'selected':'')+'">پژواک</button></div><div class="shopTabs" id="filters"></div><div class="shopGrid" id="shopGrid"></div><div class="micro" dir="rtl">قدرت‌های ذخیره در دور بعد مصرف می‌شوند؛ از هر نوع یک عدد. صندوق: شانس برابر ۱۲٫۵٪ برای هر یک از ۸ قدرت. خرید فقط با ارز داخل بازی است.</div>';for(let [key,name] of [['all','همه'],['module','ارتقای دائمی'],['skin','بدنه‌ها'],['power','تجهیزات'],['life','ترمیم'],['chest','محموله‌ها']]){let b=document.createElement('button');b.textContent=name;b.className=shopFilter===key?'selected':'';b.onclick=()=>{shopFilter=key;shop(m)};$('filters').appendChild(b)}let grid=$('shopGrid');for(let [index,item] of catalogue(m).entries()){if(shopFilter!=='all'&&item.kind!==shopFilter)continue;let owned=profile.owned.includes(item.id),equipped=item.kind==='skin'&&profile.equipped[m]===item.n,card=document.createElement('div');card.className='shopCard';let palette=['#9fd8e8','#dbb789','#c1a9e4','#a4ceb2','#e09d98','#c5d4e1'],color=palette[(item.n||index)%6];card.innerHTML='<span class="serial">'+String(index+1).padStart(2,'0')+' / '+(item.kind==='skin'?'HULL':'GEAR')+'</span><div class="shopArt">'+iconSVG(item.kind==='skin'?(m==='classic'?'ball':'skin'):(item.kind==='module'?item.art:item.key||item.kind),color,item.n||1)+'</div><h3>'+item.label+'</h3><p>'+({module:item.desc,skin:'بدنهٔ تزئینی؛ بدون برتری قدرت در مبارزه.',power:'یک بار مصرف · آماده‌سازی دور بعد',life:'ذخیرهٔ ترمیم · سقف پنج جان در هر دور',chest:'محمولهٔ مهرشده با '+item.n+' قدرت مصرفی'}[item.kind])+'</p>'+(item.kind==='power'?'<small>موجودی انبار: '+(profile.stock[m][item.key]||0)+'</small>':'')+(item.kind==='life'?'<small>ذخیرهٔ ترمیم: '+(profile.stock[m].lives||0)+'</small>':'');if(item.kind==='module'&&moduleLevel(item.key)>=3){let b=document.createElement('button');b.textContent='ارتقای کامل · سطح ۳';b.disabled=true;card.appendChild(b)}else if(owned){let b=document.createElement('button');b.textContent=equipped?'فعال روی بدنه':'نصب بدنه';b.onclick=()=>{profile.equipped[m]=item.n;saveProfile();shop(m)};card.appendChild(b)}else for(let currency of ['coins','gems']){let b=document.createElement('button');b.className=currency==='gems'?'alt':'';b.textContent=item[currency]+(currency==='coins'?' سکه':' الماس');b.disabled=profile[currency]<item[currency];b.onclick=()=>buy(item,m,currency);card.appendChild(b)}grid.appendChild(card)}$('tabSpace').onclick=()=>shop('space');$('tabClassic').onclick=()=>shop('classic');$('shopBack').onclick=menu}
function buy(item,m,currency){if(item.kind==='module'){let fresh=catalogue(m).find(x=>x.id===item.id);if(moduleLevel(item.key)>=3||profile[currency]<fresh[currency])return;profile[currency]-=fresh[currency];profile.upgrades[item.key]=moduleLevel(item.key)+1;saveProfile();shop(m);toast('تجهیز دائمی ارتقا یافت');return}if(profile[currency]<item[currency])return;profile[currency]-=item[currency];let stock=profile.stock[m],message='خرید انجام شد';if(item.kind==='skin'){profile.owned.push(item.id);profile.equipped[m]=item.n}else if(item.kind==='life')stock.lives=(stock.lives||0)+item.n;else if(item.kind==='power')stock[item.key]=(stock[item.key]||0)+1;else{let powers=catalogue(m).filter(i=>i.kind==='power'),won=[];for(let i=0;i<item.n;i++){let p=powers[Math.floor(Math.random()*powers.length)];stock[p.key]=(stock[p.key]||0)+1;won.push(p.label)}message=won.join(' + ')}saveProfile();shop(m);tone(600,.12);toast(message)}
let coinBonus=1,gemBonus=1,autoPowder=0;
function applyLoadout(){coinBonus=gemBonus=1;autoPowder=0;let stock=profile.stock[mode],extra=Math.min(2,stock.lives||0);lives+=extra;stock.lives=(stock.lives||0)-extra;for(let key of Object.keys(stock)){if(key==='lives'||stock[key]<=0)continue;stock[key]--;if(key==='coinBoost')coinBonus=2;else if(key==='gemBoost')gemBonus=2;else if(key==='slow')freeze=12;else if(key==='powder')autoPowder=12;else if(key==='heart')lives=Math.min(5,lives+1);else collectDrop({type:key,x:W/2,y:H/2})}saveProfile()}
function bankRun(){if(runBanked)return;runBanked=true;profile.coins+=Math.floor(coins*coinBonus);profile.gems+=Math.floor(gems*gemBonus);saveProfile()}

function beginBoss(){boss={x:W/2,y:Math.min(H*.28,220),r:Math.min(W*.12,48),hp:mode==='space'?65+stage*2:38+Math.floor(stage*.65),max:mode==='space'?65+stage*2:38+Math.floor(stage*.65),time:0,cool:1.8,hit:0};objs=[];enemies=[];enemyShots=[];toast(chapter().boss);tone(170,.4)}
function hurtBoss(n){if(!boss)return;boss.hp-=n;boss.hit=.1;if(boss.hp<=0){let x=boss.x,y=boss.y;burst(x,y,chapter().accent,80);boss=null;bossDone=true;enemyShots=[];coins+=60;gems+=3;hud();$('bossBar').classList.add('hidden');toast('محافظ شکست خورد');tone(520,.3)}}
function updateBoss(dt){bossClock+=dt;if(stage%5===0&&!bossDone&&!boss&&stageTime>10)beginBoss();if(!boss)return;let b=boss;b.time+=dt;b.hit=Math.max(0,b.hit-dt);b.x=W/2+Math.sin(b.time*.8)*W*.28;b.cool-=dt*(freeze?.3:1);spawn=enemySpawn=2;for(let i=shots.length-1;i>=0;i--){let shot=shots[i];if(Math.hypot(shot.x-b.x,shot.y-b.y)<b.r+shot.r){shots.splice(i,1);hurtBoss(shot.bomb?6:1);if(!boss)return}}if(mode==='space'&&laser>0&&Math.abs(shipX-b.x)<b.r){hurtBoss(dt*18);if(!boss)return}if(mode==='classic'&&pointer&&Math.hypot(aim.x-b.x,aim.y-b.y)<b.r+35&&Math.sin(b.time*1.5)>-.7){hurtBoss(dt*12);if(!boss)return;burst(aim.x,aim.y,chapter().accent,1)}if(b.cool<=0){b.cool=mode==='space'?Math.max(.7,1.8-stage*.005):2.6;if(mode==='space'){let count=b.hp<b.max*.5?7:5;for(let i=0;i<count;i++){let angle=Math.PI/2+(i-(count-1)/2)*.2;enemyShots.push({x:b.x,y:b.y+b.r,vx:Math.cos(angle)*145,vy:Math.sin(angle)*145,r:5,col:'#ffab8d'})}}else for(let i=0;i<3;i++)objs.push({x:W*(.2+i*.3),y:b.y+b.r,r:14,type:i===1?'red':'white',vy:110+stage,rot:0})}$('bossBar').classList.remove('hidden');$('bossBar').innerHTML=chapter().boss+' / '+Math.ceil(b.hp)+'<div class="bossTrack"><div class="bossFill" style="width:'+Math.max(0,b.hp/b.max*100)+'%"></div></div>'}
function drawBoss(){if(!boss)return;let b=boss,c=chapter();cx.save();cx.translate(b.x,b.y);cx.rotate(Math.sin(b.time)*.12);cx.strokeStyle=b.hit?'#fff':c.accent;cx.fillStyle=c.color;cx.lineWidth=3;cx.shadowColor=c.accent;cx.shadowBlur=b.hit?25:10;if(mode==='space'){cx.beginPath();cx.moveTo(0,b.r);cx.lineTo(-b.r*.5,b.r*.35);cx.lineTo(-b.r*1.4,b.r*.6);cx.lineTo(-b.r,-b.r*.6);cx.lineTo(-b.r*.3,-b.r*.35);cx.lineTo(0,-b.r);cx.lineTo(b.r*.3,-b.r*.35);cx.lineTo(b.r,-b.r*.6);cx.lineTo(b.r*1.4,b.r*.6);cx.lineTo(b.r*.5,b.r*.35);cx.closePath();cx.fill();cx.stroke()}else{cx.rotate(b.time*.3);for(let i=0;i<6;i++){cx.rotate(Math.PI/3);cx.strokeRect(-b.r*.28,-b.r,b.r*.56,b.r*.45)}cx.beginPath();cx.arc(0,0,b.r*.7,0,Math.PI*2);cx.fill();cx.stroke()}cx.fillStyle=(mode==='classic'&&Math.sin(b.time*1.5)<=-.7)?'#ed705d':'#e4ffff';cx.beginPath();cx.arc(0,0,b.r*.24,0,Math.PI*2);cx.fill();cx.restore()}

// Back buttons live above the scrollable content rather than after dozens of cards.
function ntBackButton(text,fn){const b=document.createElement('button');b.className='nt-back';b.textContent=text;b.type='button';b.onclick=fn;return b}
function ntGoHome(){if(npPaused||['play','ready','count'].includes(state)){if(!npPaused)pauseRun();confirmMenu()}else menu()}
const ntPanel=bbPanel;bbPanel=function(title,sub=''){const p=ntPanel(title,sub);const head=p.querySelector('.bb-head');if(head){head.classList.add('nt-sticky-head');const b=p.querySelector('#bbBack');if(b){b.textContent='⌂ منوی اصلی';b.classList.add('nt-back')}}return p};
const ntDialog=npDialog;npDialog=function(title,sub){const body=ntDialog(title,sub);const bar=document.createElement('nav');bar.className='nt-dialog-nav';bar.setAttribute('aria-label','بازگشت و ادامه');bar.append(ntBackButton('← برگشت',()=>showPause()),ntBackButton('▶ ادامه',resumeRun),ntBackButton('⌂ منو',confirmMenu));body.parentElement.prepend(bar);return body};
function ntPageBack(){const p=$('panel');if(!p||p.querySelector('.nt-page-back'))return;const bar=document.createElement('nav');bar.className='nt-page-back';bar.append(ntBackButton('⌂ منوی اصلی',ntGoHome));p.prepend(bar)}
const ntStory=story;story=function(m,n,next){ntStory(m,n,next);ntPageBack()};
const ntLevelMap=levelMap;levelMap=function(m,page){ntLevelMap(m,page);const h=$('panel').querySelector('.shopHead');if(h)h.classList.add('nt-sticky-head');const b=$('mapBack');if(b){b.textContent='⌂ منوی اصلی';b.classList.add('nt-back')}};

const ntShop=shop;shop=function(m='space'){ntShop(m);const foot=$('panel').querySelector('.bb-foot');if(foot)foot.textContent='۳۵ آیتم انباری با مصرف دستی؛ نیترو و تجهیزات تا زمان استفاده در همین مرورگر ذخیره می‌شوند. تجهیزات قدیمی هنوز در آغاز دور مصرف می‌شوند.'};
// Story contracts are finite, untimed and available without advertising or payments.
const FLIGHT_MISSIONS=[
 {key:'salvage',need:3,title:'۱ · سه قطعه برای رادیو',text:'رادیوی بندر فقط خش‌خش می‌کند. سه محموله جدید پیدا کن تا مهندس بتواند گیرنده را سرهم کند.',reward:'۱۲۰ سکه + ۱ نیترو',grant:()=>{profile.coins+=120;bb.nitro=Math.min(99,bb.nitro+1)}},
 {key:'dodge',need:3,title:'۲ · میان دو ضربان',text:'برای گذشتن از حلقه باید به بدنه‌ات اعتماد کنی. سه بار با دو ضربه روی خود سفینه ملق بزن؛ هر ملق پنجره کوتاه مصونیت دارد.',reward:'یک هسته آکروبات + ۱۰۰ XP',grant:()=>{bb.inventory.rollCore++;bb.xp+=100}},
 {key:'boost',need:1,title:'۳ · شکستن سکوت',text:'برج با سرعت عادی پاسخ نمی‌دهد. سه نیترو ذخیره کن و یک‌بار دیوار صوتی را بشکن تا صدایت به آن سوی مدار برسد.',reward:'یک صندوق + ۲ الماس',grant:()=>{bb.chests++;profile.gems+=2}},
 {key:'white',need:30,title:'۴ · سی خاطره سفید',text:'پاسخ برج یک صدا نیست؛ سی خاطره است. در مسیر گوی‌ها، سی گوی سفید نجات بده تا پیام کامل شود.',reward:'یک تکه خاطره + ۱۵۰ سکه',grant:()=>{bb.inventory.memoryShard++;profile.coins+=150}},
 {key:'clears',need:2,title:'۵ · چراغ بندر',text:'دو مرحله تازه را در هر کدام از مسیرها کامل کن. وقتی آخرین پالس برسد، چراغ بندر برای اولین بار پس از خاموشی روشن خواهد شد.',reward:'۲ صندوق + ۲۰۰ XP',grant:()=>{bb.chests+=2;bb.xp+=200}}
];
const radioMessages=['«اگر صدای من را می‌شنوی، چراغ آبی بندر را دنبال کن.»','«گوی‌های سفید، خاطره مردم‌اند؛ آن‌ها را به هسته برسان.»','«وقتی دیوار صوتی شکست، فهمیدیم هنوز کسی آن بیرون زنده است.»','«خانه منتظر قهرمان نیست؛ منتظر برگشتن توست.»'];
function ntJournal(){const p=bbPanel('دفتر پرواز','۵ مأموریت داستانی بدون محدودیت زمانی · پیشرفت محلی و جوایز یک‌بارمصرف');p.insertAdjacentHTML('beforeend','<div class="nt-journal-intro">'+artImg('signalDecoder')+'<div><b>آخرین پیام بندر</b><p>سفینه راه را باز می‌کند؛ گوی‌ها حافظه شهر را برمی‌گردانند.</p></div></div>');FLIGHT_MISSIONS.forEach((m,i)=>{const claimed=bb.storyClaims.includes(i),unlocked=i===0||bb.storyClaims.includes(i-1),count=Math.min(m.need,bb.flightLog[m.key]);const card=document.createElement('article');card.className='nt-mission';card.innerHTML='<h3>'+m.title+'</h3><p>'+m.text+'</p><div class="bb-track"><i style="width:'+Math.min(100,count/m.need*100)+'%"></i></div><small>'+count+' / '+m.need+' · جایزه: '+m.reward+'</small>';const b=bbButton(card,claimed?'جایزه دریافت شد ✓':!unlocked?'اول مأموریت قبلی':count<m.need?'در حال پیشرفت':'دریافت جایزه',()=>{if(bb.storyClaims.includes(i)||bb.flightLog[m.key]<m.need||i>0&&!bb.storyClaims.includes(i-1))return;bb.storyClaims.push(i);m.grant();bbSave();ntJournal();ssSfx('win')});b.disabled=claimed||!unlocked||count<m.need;p.appendChild(card)});p.insertAdjacentHTML('beforeend','<h3>پیام‌های رمزگشایی‌شده · '+bb.flightLog.signals+'</h3>');if(!bb.flightLog.signals)p.insertAdjacentHTML('beforeend','<p class="bb-sub">با آیتم رمزگشای رادیو، پیام تازه باز کن.</p>');radioMessages.slice(0,Math.min(4,bb.flightLog.signals)).forEach(text=>{const d=document.createElement('p');d.className='nt-radio-message';d.textContent=text;p.appendChild(d)})}
// Flight input is evaluated before the existing drag handler updates the ship target.
function ntRollTap(p,stamp){if(state!=='play'||mode!=='space'||npPaused)return false;const near=Math.hypot(p.x-shipX,p.y-flightY())<72;if(!near){ntLastTap=-1000;ntLastPoint=null;return false}const double=stamp-ntLastTap>35&&stamp-ntLastTap<340&&ntLastPoint&&Math.hypot(p.x-ntLastPoint.x,p.y-ntLastPoint.y)<55;ntLastTap=stamp;ntLastPoint={x:p.x,y:p.y};if(!double||rollCD>0||roll>0)return false;roll=.65;rollCD=ntEffects.agile>0?2.5:5;invuln=Math.max(invuln,.8);ntLastTap=-1000;bb.flightLog.dodge++;ntSave();burst(shipX,flightY(),'#a2ecff',22);ssNote(330,.3,'triangle',.1,0,1100);ssHiss(.14,.05,2300);toast('ملق! · جاخالی');return true}
const nitroButton=document.createElement('button');nitroButton.id='ntNitro';nitroButton.className='nt-nitro hidden';nitroButton.type='button';game.appendChild(nitroButton);
function refreshNitro(){const show=mode==='space'&&['play','ready','count','paused'].includes(state);nitroButton.classList.toggle('hidden',!show);nitroButton.disabled=npPaused||state!=='play'||nitroTime>0||nitroCooldown>0||bb.nitro<3;nitroButton.classList.toggle('nt-burning',nitroTime>0);nitroButton.innerHTML='<b>'+(nitroTime>0?'اوج! '+Math.ceil(nitroTime)+'ث':nitroCooldown>0?'خنک‌سازی '+Math.ceil(nitroCooldown)+'ث':'نیترو ↑')+'</b><span>مخزن '+bb.nitro+' / مصرف ۳</span>'}
function triggerNitro(){if(state!=='play'||mode!=='space'||npPaused||nitroTime>0||nitroCooldown>0||bb.nitro<3)return false;bb.nitro-=3;bb.flightLog.boost++;nitroTime=6;nitroCooldown=18;nitroWave=1;nitroWaveX=shipX;nitroWaveY=flightY();invuln=Math.max(invuln,6);rapid=Math.max(rapid,6);spread=Math.max(spread,6);bomb=Math.max(bomb,6);enemyShots=[];for(const o of objs)burst(o.x,o.y,'#ffce89',4);objs=[];for(const e of [...enemies]){e.hp=1;enemyHit(e)}if(boss)hurtBoss(Math.min(45,boss.max*.25));bbSave();ssNote(75,.45,'sawtooth',.16,0,700);ssNote(150,.45,'sine',.25,0,28);ssHiss(.6,.14,250);toast('دیوار صوتی! · ۶ ثانیه اوج و آتش');refreshNitro();return true}
nitroButton.onclick=triggerNitro;
const ntCollect=collectDrop;collectDrop=function(d){if(d.type==='nitroCan'){addNitro(1);bb.flightLog.salvage++;ntSave();ssSfx('pickup');return}ntCollect(d);if(cargoByKey[d.type]){bb.flightLog.salvage++;ntSave()}};

const ntEnemy=enemyHit;enemyHit=function(e){if(ntEffects.heavy>0&&enemies.includes(e))e.hp--;ntEnemy(e)};
const ntBoss=hurtBoss;hurtBoss=function(n){ntBoss(n*(ntEffects.heavy>0?1.25:1))};
const ntShoot=shoot;shoot=function(){const ready=state==='play'&&mode==='space'&&fireCD<=0;ntShoot();if(ready&&ntEffects.echo>0)for(const side of [-1,1])shots.push({x:shipX+side*22,y:flightY()-25,vx:side*80,vy:-620,r:4,bomb:false})};
const ntAdd=add;add=function(n){ntAdd(n+(mode==='classic'?(ntEffects.echo>0?2:0)+(ntEffects.heavy>0?1:0):0))};
const ntTap=tap;tap=function(p){const hit=[...objs].reverse().find(o=>Math.hypot(p.x-o.x,p.y-o.y)<=o.r+12);ntTap(p);if(mode==='classic'&&hit&&hit.type==='white'&&!objs.includes(hit)){bb.flightLog.white++;ntSave()}};
const ntCampaign=campaign;campaign=function(dt){const before=(profile.cleared.space||0)+(profile.cleared.classic||0);ntCampaign(dt);const after=(profile.cleared.space||0)+(profile.cleared.classic||0);if(after>before){bb.flightLog.clears+=after-before;ntSave()}};
const ntPrepare=prepareRun;prepareRun=function(m){nitroTime=nitroCooldown=nitroWave=0;ntLastTap=-1000;ntLastPoint=null;ntEffects={agile:0,echo:0,heavy:0,guard:0,guardTick:10};ntPrepare(m);refreshNitro()};
const ntUpdate=update;let ntRefreshAt=0;
update=function(dt,now){if(state==='play'&&!npPaused){nitroTime=Math.max(0,nitroTime-dt);nitroCooldown=Math.max(0,nitroCooldown-dt);nitroWave=Math.max(0,nitroWave-dt);for(const k of ['agile','echo','heavy'])ntEffects[k]=Math.max(0,ntEffects[k]-dt);if(ntEffects.guard>0){const step=Math.min(dt,ntEffects.guard);ntEffects.guard-=step;ntEffects.guardTick-=step;if(ntEffects.guardTick<=.00001){ntEffects.guardTick+=10;shield=1;toast('گوی نگهبان: سپر آماده')}}if(nitroTime>0){rapid=Math.max(rapid,.2);spread=Math.max(spread,.2);bomb=Math.max(bomb,.2);invuln=Math.max(invuln,.2)}}ntUpdate(dt,now);if(now-ntRefreshAt>120){refreshNitro();ntRefreshAt=now}};
const ntDrawShip=drawShip;drawShip=function(){if(nitroTime>0){cx.save();cx.translate(shipX,flightY());cx.globalCompositeOperation='lighter';for(const side of [-1,1]){const len=65+Math.sin(elapsed*45)*12;const g=cx.createLinearGradient(0,20,0,len+22);g.addColorStop(0,'#ffffff');g.addColorStop(.25,'#8afaff');g.addColorStop(.6,'#ffac59');g.addColorStop(1,'#ff683000');cx.fillStyle=g;cx.beginPath();cx.moveTo(side*16-8,18);cx.lineTo(side*16,len+22);cx.lineTo(side*16+8,18);cx.fill()}cx.restore()}ntDrawShip()};

const ntMenu=menu;menu=function(){ntMenu();bbButton($('bbNav'),'دفتر پرواز · داستان',ntJournal);$('panel').insertAdjacentHTML('beforeend','<div class="nt-help">'+artImg('nitroCan')+'<p><b>مخزن نیترو: '+bb.nitro+'</b><br>دو ضربه روی سفینه: ملق و جاخالی<br>۳ نیترو: اوج‌گیری، آتش بیشتر و موج صوتی<br>۳۵ آیتم انباری · بدون زمان انقضای مأموریت</p></div>');refreshNitro()};
